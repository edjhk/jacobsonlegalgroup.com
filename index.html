<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Coming soon</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f6f3;
      color: #28313b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .accent {
      width: 3rem;
      height: 2px;
      margin: 1.5rem auto 0;
      background: #a18b63;
    }
  </style>
</head>

<body>
  <main>
    <h1>Coming soon&hellip;</h1>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
